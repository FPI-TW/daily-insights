name: Daily Insights CD

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/production/**"
      - "scripts/production/**"
      - "compose.production.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: production-daily-insights
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_IMAGE_REPOSITORY: ghcr.io/fpi-tw/daily-insights-api
  WEB_IMAGE_REPOSITORY: ghcr.io/fpi-tw/daily-insights-web

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        id: api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.API_IMAGE_REPOSITORY }}:latest
            ${{ env.API_IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=daily-insights-api
          cache-to: type=gha,mode=max,scope=daily-insights-api

      - name: Build and push Web image
        id: web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WEB_IMAGE_REPOSITORY }}:latest
            ${{ env.WEB_IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=daily-insights-web
          cache-to: type=gha,mode=max,scope=daily-insights-web

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    permissions:
      contents: read
      packages: read

    env:
      GITHUB_ACTOR: ${{ github.actor }}
      API_IMAGE: ghcr.io/fpi-tw/daily-insights-api@${{ needs.build-push.outputs.api_digest }}
      WEB_IMAGE: ghcr.io/fpi-tw/daily-insights-web@${{ needs.build-push.outputs.web_digest }}
      PUBLIC_HOSTNAME: ${{ vars.PUBLIC_HOSTNAME }}
      DAILY_INSIGHTS_DATABASE_URL: ${{ secrets.DAILY_INSIGHTS_DATABASE_URL }}
      DAILY_INSIGHTS_SESSION_SECRET: ${{ secrets.DAILY_INSIGHTS_SESSION_SECRET }}
      DAILY_INSIGHTS_PASSWORD_PEPPER: ${{ secrets.DAILY_INSIGHTS_PASSWORD_PEPPER }}
      DAILY_INSIGHTS_MORNING_REPORTS_ENABLED: ${{ vars.DAILY_INSIGHTS_MORNING_REPORTS_ENABLED }}
      DAILY_INSIGHTS_ANALYST_VIEWPOINTS_ENABLED: ${{ vars.DAILY_INSIGHTS_ANALYST_VIEWPOINTS_ENABLED }}
      DAILY_INSIGHTS_ANALYST_VIEWPOINTS_BASE_URL: ${{ vars.DAILY_INSIGHTS_ANALYST_VIEWPOINTS_BASE_URL }}
      DAILY_INSIGHTS_ANALYST_VIEWPOINTS_API_KEY: ${{ secrets.DAILY_INSIGHTS_ANALYST_VIEWPOINTS_API_KEY }}
      DAILY_INSIGHTS_ANALYST_VIEWPOINTS_TIMEOUT_SECONDS: ${{ vars.DAILY_INSIGHTS_ANALYST_VIEWPOINTS_TIMEOUT_SECONDS }}
      DAILY_INSIGHTS_CHAT_ENABLED: ${{ vars.DAILY_INSIGHTS_CHAT_ENABLED }}
      DAILY_INSIGHTS_CHAT_MODEL_PROVIDER: ${{ vars.DAILY_INSIGHTS_CHAT_MODEL_PROVIDER }}
      DAILY_INSIGHTS_CHAT_MODEL_NAME: ${{ vars.DAILY_INSIGHTS_CHAT_MODEL_NAME }}
      DAILY_INSIGHTS_CHAT_MODEL_API_BASE_URL: ${{ vars.DAILY_INSIGHTS_CHAT_MODEL_API_BASE_URL }}
      DAILY_INSIGHTS_CHAT_MODEL_API_KEY: ${{ secrets.DAILY_INSIGHTS_CHAT_MODEL_API_KEY }}
      DAILY_INSIGHTS_CHAT_TIMEOUT_SECONDS: ${{ vars.DAILY_INSIGHTS_CHAT_TIMEOUT_SECONDS }}
      DAILY_INSIGHTS_TWELVE_DATA_BASE_URL: ${{ vars.DAILY_INSIGHTS_TWELVE_DATA_BASE_URL }}
      DAILY_INSIGHTS_TWELVE_DATA_API_KEY: ${{ secrets.DAILY_INSIGHTS_TWELVE_DATA_API_KEY }}
      DAILY_INSIGHTS_DAILY_NEWS_ENABLED: ${{ vars.DAILY_INSIGHTS_DAILY_NEWS_ENABLED }}
      DAILY_INSIGHTS_YFINANCE_ENABLED: ${{ vars.DAILY_INSIGHTS_YFINANCE_ENABLED }}
      DAILY_INSIGHTS_TWSE_ENABLED: ${{ vars.DAILY_INSIGHTS_TWSE_ENABLED }}
      DAILY_INSIGHTS_NEWS_EXTRA_HOSTNAMES: ${{ vars.DAILY_INSIGHTS_NEWS_EXTRA_HOSTNAMES }}
      DAILY_INSIGHTS_NEWS_BLOCKED_HOSTNAMES: ${{ vars.DAILY_INSIGHTS_NEWS_BLOCKED_HOSTNAMES }}
      DAILY_INSIGHTS_GUARDIAN_API_KEY: ${{ secrets.DAILY_INSIGHTS_GUARDIAN_API_KEY }}
      DAILY_INSIGHTS_SEC_CONTACT_EMAIL: ${{ vars.DAILY_INSIGHTS_SEC_CONTACT_EMAIL }}
      DAILY_INSIGHTS_MODEL_NAME: ${{ vars.DAILY_INSIGHTS_MODEL_NAME }}
      DAILY_INSIGHTS_MODEL_API_BASE_URL: ${{ vars.DAILY_INSIGHTS_MODEL_API_BASE_URL }}
      DAILY_INSIGHTS_NEWS_MODEL_API_KEY: ${{ secrets.DAILY_INSIGHTS_NEWS_MODEL_API_KEY }}
      DAILY_INSIGHTS_R2_ENDPOINT_URL: ${{ vars.DAILY_INSIGHTS_R2_ENDPOINT_URL }}
      DAILY_INSIGHTS_R2_BUCKET_NAME: ${{ vars.DAILY_INSIGHTS_R2_BUCKET_NAME }}
      DAILY_INSIGHTS_R2_ACCESS_KEY_ID: ${{ secrets.DAILY_INSIGHTS_R2_ACCESS_KEY_ID }}
      DAILY_INSIGHTS_R2_SECRET_ACCESS_KEY: ${{ secrets.DAILY_INSIGHTS_R2_SECRET_ACCESS_KEY }}
      DAILY_INSIGHTS_R2_SIGNED_URL_TTL_SECONDS: ${{ vars.DAILY_INSIGHTS_R2_SIGNED_URL_TTL_SECONDS }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate deployment configuration
        env:
          EC2_HOST: ${{ secrets.DAILY_INSIGHTS_EC2_HOST }}
          EC2_USER: ${{ secrets.DAILY_INSIGHTS_EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.DAILY_INSIGHTS_EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            EC2_HOST \
            EC2_USER \
            EC2_SSH_KEY \
            API_IMAGE \
            WEB_IMAGE \
            PUBLIC_HOSTNAME \
            DAILY_INSIGHTS_DATABASE_URL \
            DAILY_INSIGHTS_SESSION_SECRET \
            DAILY_INSIGHTS_PASSWORD_PEPPER \
            DAILY_INSIGHTS_MORNING_REPORTS_ENABLED \
            DAILY_INSIGHTS_ANALYST_VIEWPOINTS_ENABLED \
            DAILY_INSIGHTS_DAILY_NEWS_ENABLED \
            DAILY_INSIGHTS_YFINANCE_ENABLED \
            DAILY_INSIGHTS_TWSE_ENABLED \
            DAILY_INSIGHTS_CHAT_ENABLED \
            DAILY_INSIGHTS_R2_ENDPOINT_URL \
            DAILY_INSIGHTS_R2_BUCKET_NAME \
            DAILY_INSIGHTS_R2_ACCESS_KEY_ID \
            DAILY_INSIGHTS_R2_SECRET_ACCESS_KEY \
            DAILY_INSIGHTS_R2_SIGNED_URL_TTL_SECONDS; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing deployment value::$name must be configured in the production environment"
              missing=1
            fi
          done
          for image_name in API_IMAGE WEB_IMAGE; do
            if ! grep -Eq '@sha256:[a-f0-9]{64}$' <<<"${!image_name:-}" ||
              grep -Eq '@sha256:0{64}$' <<<"${!image_name:-}"; then
              echo "::error title=Mutable image reference::$image_name must use an immutable sha256 digest"
              missing=1
            fi
          done
          if [ "${#DAILY_INSIGHTS_SESSION_SECRET}" -lt 32 ]; then
            echo "::error title=Invalid session secret::DAILY_INSIGHTS_SESSION_SECRET must contain at least 32 characters"
            missing=1
          fi
          if [ "${#DAILY_INSIGHTS_PASSWORD_PEPPER}" -lt 32 ]; then
            echo "::error title=Invalid password pepper::DAILY_INSIGHTS_PASSWORD_PEPPER must contain at least 32 characters"
            missing=1
          fi
          if [ "$DAILY_INSIGHTS_SESSION_SECRET" = "$DAILY_INSIGHTS_PASSWORD_PEPPER" ]; then
            echo "::error title=Duplicate authentication secrets::Session secret and password pepper must differ"
            missing=1
          fi
          if ! grep -Eq '^(true|false)$' <<<"$DAILY_INSIGHTS_MORNING_REPORTS_ENABLED"; then
            echo "::error title=Invalid scheduler flag::DAILY_INSIGHTS_MORNING_REPORTS_ENABLED must be true or false"
            missing=1
          fi
          if ! grep -Eq '^(true|false)$' <<<"$DAILY_INSIGHTS_ANALYST_VIEWPOINTS_ENABLED"; then
            echo "::error title=Invalid scheduler flag::DAILY_INSIGHTS_ANALYST_VIEWPOINTS_ENABLED must be true or false"
            missing=1
          fi
          if ! grep -Eq '^(true|false)$' <<<"$DAILY_INSIGHTS_CHAT_ENABLED"; then
            echo "::error title=Invalid chat flag::DAILY_INSIGHTS_CHAT_ENABLED must be true or false"
            missing=1
          fi
          if [ "$DAILY_INSIGHTS_MORNING_REPORTS_ENABLED" = true ]; then
            for name in \
              DAILY_INSIGHTS_TWELVE_DATA_BASE_URL \
              DAILY_INSIGHTS_TWELVE_DATA_API_KEY; do
              if [ -z "${!name:-}" ]; then
                echo "::error title=Missing Twelve Data launch value::$name is required when morning reports are enabled"
                missing=1
              fi
            done
          fi
          if ! grep -Eq '^(true|false)$' <<<"$DAILY_INSIGHTS_DAILY_NEWS_ENABLED"; then
            echo "::error title=Invalid scheduler flag::DAILY_INSIGHTS_DAILY_NEWS_ENABLED must be true or false"
            missing=1
          fi
          if ! grep -Eq '^(true|false)$' <<<"$DAILY_INSIGHTS_YFINANCE_ENABLED"; then
            echo "::error title=Invalid scheduler flag::DAILY_INSIGHTS_YFINANCE_ENABLED must be true or false"
            missing=1
          fi
          if ! grep -Eq '^(true|false)$' <<<"$DAILY_INSIGHTS_TWSE_ENABLED"; then
            echo "::error title=Invalid scheduler flag::DAILY_INSIGHTS_TWSE_ENABLED must be true or false"
            missing=1
          fi
          if [ "$DAILY_INSIGHTS_DAILY_NEWS_ENABLED" = true ] && [ -z "${DAILY_INSIGHTS_NEWS_MODEL_API_KEY:-}" ]; then
            echo "::error title=Missing daily news launch value::DAILY_INSIGHTS_NEWS_MODEL_API_KEY is required when daily news is enabled"
            missing=1
          fi
          if [ "$DAILY_INSIGHTS_ANALYST_VIEWPOINTS_ENABLED" = true ]; then
            for name in \
              DAILY_INSIGHTS_ANALYST_VIEWPOINTS_BASE_URL \
              DAILY_INSIGHTS_ANALYST_VIEWPOINTS_API_KEY \
              DAILY_INSIGHTS_ANALYST_VIEWPOINTS_TIMEOUT_SECONDS; do
              if [ -z "${!name:-}" ]; then
                echo "::error title=Missing analyst viewpoints launch value::$name is required when analyst viewpoints are enabled"
                missing=1
              fi
            done
          fi
          if [ "$DAILY_INSIGHTS_CHAT_ENABLED" = true ]; then
            for name in \
              DAILY_INSIGHTS_CHAT_MODEL_PROVIDER \
              DAILY_INSIGHTS_CHAT_MODEL_NAME \
              DAILY_INSIGHTS_CHAT_MODEL_API_BASE_URL \
              DAILY_INSIGHTS_CHAT_MODEL_API_KEY \
              DAILY_INSIGHTS_CHAT_TIMEOUT_SECONDS; do
              if [ -z "${!name:-}" ]; then
                echo "::error title=Missing chat launch value::$name is required when chat is enabled"
                missing=1
              fi
            done
          fi
          for name in \
            DAILY_INSIGHTS_DATABASE_URL \
            DAILY_INSIGHTS_SESSION_SECRET \
            DAILY_INSIGHTS_PASSWORD_PEPPER \
            DAILY_INSIGHTS_CHAT_MODEL_PROVIDER \
            DAILY_INSIGHTS_CHAT_MODEL_NAME \
            DAILY_INSIGHTS_CHAT_MODEL_API_BASE_URL \
            DAILY_INSIGHTS_CHAT_MODEL_API_KEY \
            DAILY_INSIGHTS_CHAT_TIMEOUT_SECONDS \
            DAILY_INSIGHTS_TWELVE_DATA_BASE_URL \
            DAILY_INSIGHTS_TWELVE_DATA_API_KEY \
            DAILY_INSIGHTS_NEWS_MODEL_API_KEY \
            DAILY_INSIGHTS_ANALYST_VIEWPOINTS_BASE_URL \
            DAILY_INSIGHTS_ANALYST_VIEWPOINTS_API_KEY \
            DAILY_INSIGHTS_ANALYST_VIEWPOINTS_TIMEOUT_SECONDS \
            DAILY_INSIGHTS_R2_ENDPOINT_URL \
            DAILY_INSIGHTS_R2_BUCKET_NAME \
            DAILY_INSIGHTS_R2_ACCESS_KEY_ID \
            DAILY_INSIGHTS_R2_SECRET_ACCESS_KEY \
            DAILY_INSIGHTS_R2_SIGNED_URL_TTL_SECONDS; do
            if [[ "${!name:-}" == *$'\n'* || "${!name:-}" == *$'\r'* ]]; then
              echo "::error title=Invalid multiline value::$name must be a single SSH environment value"
              missing=1
            fi
          done
          for name in \
            DAILY_INSIGHTS_DATABASE_URL \
            DAILY_INSIGHTS_SESSION_SECRET \
            DAILY_INSIGHTS_PASSWORD_PEPPER \
            DAILY_INSIGHTS_CHAT_MODEL_API_BASE_URL \
            DAILY_INSIGHTS_CHAT_MODEL_API_KEY \
            DAILY_INSIGHTS_TWELVE_DATA_BASE_URL \
            DAILY_INSIGHTS_TWELVE_DATA_API_KEY \
            DAILY_INSIGHTS_NEWS_MODEL_API_KEY \
            DAILY_INSIGHTS_ANALYST_VIEWPOINTS_BASE_URL \
            DAILY_INSIGHTS_ANALYST_VIEWPOINTS_API_KEY \
            DAILY_INSIGHTS_R2_ENDPOINT_URL \
            DAILY_INSIGHTS_R2_BUCKET_NAME \
            DAILY_INSIGHTS_R2_ACCESS_KEY_ID \
            DAILY_INSIGHTS_R2_SECRET_ACCESS_KEY; do
            if grep -Eqi 'change[_-]?me|replace[_-]?|example[._]|user:password|account[_-]?id|rds[_-]?private[_-]?host' <<<"${!name:-}"; then
              echo "::error title=Placeholder deployment value::$name must contain a production value"
              missing=1
            fi
          done
          if [[ "$DAILY_INSIGHTS_DATABASE_URL" != postgresql+psycopg://* ]]; then
            echo "::error title=Invalid database URL::DAILY_INSIGHTS_DATABASE_URL must use postgresql+psycopg"
            missing=1
          fi
          for name in DAILY_INSIGHTS_R2_ENDPOINT_URL; do
            if [[ "${!name:-}" != https://* ]]; then
              echo "::error title=Invalid HTTPS URL::$name must be an absolute HTTPS URL"
              missing=1
            fi
          done
          if [ "$DAILY_INSIGHTS_MORNING_REPORTS_ENABLED" = true ] &&
            [[ "$DAILY_INSIGHTS_TWELVE_DATA_BASE_URL" != https://* ]]; then
            echo "::error title=Invalid HTTPS URL::DAILY_INSIGHTS_TWELVE_DATA_BASE_URL must be an absolute HTTPS URL"
            missing=1
          fi
          if [ "$DAILY_INSIGHTS_DAILY_NEWS_ENABLED" = true ] &&
            [ -n "${DAILY_INSIGHTS_MODEL_API_BASE_URL:-}" ] &&
            [[ "$DAILY_INSIGHTS_MODEL_API_BASE_URL" != https://* ]]; then
            echo "::error title=Invalid HTTPS URL::DAILY_INSIGHTS_MODEL_API_BASE_URL must be an absolute HTTPS URL"
            missing=1
          fi
          if [ "$DAILY_INSIGHTS_ANALYST_VIEWPOINTS_ENABLED" = true ]; then
            if [[ "$DAILY_INSIGHTS_ANALYST_VIEWPOINTS_BASE_URL" != https://* ]]; then
              echo "::error title=Invalid HTTPS URL::DAILY_INSIGHTS_ANALYST_VIEWPOINTS_BASE_URL must be an absolute HTTPS URL"
              missing=1
            fi
            if ! grep -Eq '^[0-9]+([.][0-9]+)?$' <<<"$DAILY_INSIGHTS_ANALYST_VIEWPOINTS_TIMEOUT_SECONDS" ||
              ! awk -v timeout="$DAILY_INSIGHTS_ANALYST_VIEWPOINTS_TIMEOUT_SECONDS" 'BEGIN { exit !(timeout > 0 && timeout <= 120) }'; then
              echo "::error title=Invalid analyst viewpoints timeout::DAILY_INSIGHTS_ANALYST_VIEWPOINTS_TIMEOUT_SECONDS must be greater than 0 and at most 120"
              missing=1
            fi
          fi
          if [ "$DAILY_INSIGHTS_CHAT_ENABLED" = true ]; then
            if [[ "$DAILY_INSIGHTS_CHAT_MODEL_API_BASE_URL" != https://* ]]; then
              echo "::error title=Invalid HTTPS URL::DAILY_INSIGHTS_CHAT_MODEL_API_BASE_URL must be an absolute HTTPS URL"
              missing=1
            fi
            if ! grep -Eq '^(deepseek|openai-compatible)$' <<<"$DAILY_INSIGHTS_CHAT_MODEL_PROVIDER"; then
              echo "::error title=Invalid chat provider::DAILY_INSIGHTS_CHAT_MODEL_PROVIDER must be deepseek or openai-compatible"
              missing=1
            fi
            if ! grep -Eq '^[0-9]+([.][0-9]+)?$' <<<"$DAILY_INSIGHTS_CHAT_TIMEOUT_SECONDS" ||
              ! awk -v timeout="$DAILY_INSIGHTS_CHAT_TIMEOUT_SECONDS" 'BEGIN { exit !(timeout > 0 && timeout <= 600) }'; then
              echo "::error title=Invalid chat timeout::DAILY_INSIGHTS_CHAT_TIMEOUT_SECONDS must be greater than 0 and at most 600"
              missing=1
            fi
          fi
          if ! grep -Eq '^[a-z0-9]([a-z0-9.-]*[a-z0-9])$' <<<"$PUBLIC_HOSTNAME" ||
            ! grep -q '[.]' <<<"$PUBLIC_HOSTNAME"; then
            echo "::error title=Invalid public hostname::PUBLIC_HOSTNAME must be a lowercase DNS hostname"
            missing=1
          fi
          if ! grep -Eq '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$' <<<"$DAILY_INSIGHTS_R2_BUCKET_NAME"; then
            echo "::error title=Invalid R2 bucket::DAILY_INSIGHTS_R2_BUCKET_NAME must be a valid bucket name"
            missing=1
          fi
          if ! grep -Eq '^[0-9]+$' <<<"$DAILY_INSIGHTS_R2_SIGNED_URL_TTL_SECONDS" ||
            [ "$DAILY_INSIGHTS_R2_SIGNED_URL_TTL_SECONDS" -lt 60 ] ||
            [ "$DAILY_INSIGHTS_R2_SIGNED_URL_TTL_SECONDS" -gt 3600 ]; then
            echo "::error title=Invalid signed URL TTL::DAILY_INSIGHTS_R2_SIGNED_URL_TTL_SECONDS must be between 60 and 3600"
            missing=1
          fi
          exit "$missing"

      - name: Render Cloudflare real-IP allowlist
        run: |
          set -euo pipefail
          target=infra/production/cloudflare-realip.conf
          {
            echo '# Generated from Cloudflare published IP ranges.'
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              https://www.cloudflare.com/ips-v4 |
              sed '/^[[:space:]]*$/d; s/^/set_real_ip_from /; s/$/;/'
            printf '\n'
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              https://www.cloudflare.com/ips-v6 |
              sed '/^[[:space:]]*$/d; s/^/set_real_ip_from /; s/$/;/'
          } >"$target"
          python3 scripts/production/validate-cloudflare-allowlist.py "$target"

      - name: Confirm EC2 prerequisites
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DAILY_INSIGHTS_EC2_HOST }}
          username: ${{ secrets.DAILY_INSIGHTS_EC2_USER }}
          key: ${{ secrets.DAILY_INSIGHTS_EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            sudo -n true
            command -v docker >/dev/null
            docker compose version
            docker info >/dev/null
            command -v openssl >/dev/null
            command -v systemctl >/dev/null
            systemctl is-enabled --quiet docker.service
            systemctl is-active --quiet docker.service
            mkdir -p "$HOME/daily-insights-deploy"

      - name: Sync deploy bundle to EC2
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.DAILY_INSIGHTS_EC2_HOST }}
          username: ${{ secrets.DAILY_INSIGHTS_EC2_USER }}
          key: ${{ secrets.DAILY_INSIGHTS_EC2_SSH_KEY }}
          source: "compose.production.yaml,infra/production/nginx/nginx.conf,infra/production/nginx/default.conf.template,infra/production/cloudflare-realip.conf,scripts/production/*.sh"
          target: /home/${{ secrets.DAILY_INSIGHTS_EC2_USER }}/daily-insights-deploy
          overwrite: true

      - name: Deploy to EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DAILY_INSIGHTS_EC2_HOST }}
          username: ${{ secrets.DAILY_INSIGHTS_EC2_USER }}
          key: ${{ secrets.DAILY_INSIGHTS_EC2_SSH_KEY }}
          command_timeout: 25m
          envs: GITHUB_TOKEN,GITHUB_ACTOR,API_IMAGE,WEB_IMAGE,PUBLIC_HOSTNAME,DAILY_INSIGHTS_DATABASE_URL,DAILY_INSIGHTS_SESSION_SECRET,DAILY_INSIGHTS_PASSWORD_PEPPER,DAILY_INSIGHTS_MORNING_REPORTS_ENABLED,DAILY_INSIGHTS_ANALYST_VIEWPOINTS_ENABLED,DAILY_INSIGHTS_ANALYST_VIEWPOINTS_BASE_URL,DAILY_INSIGHTS_ANALYST_VIEWPOINTS_API_KEY,DAILY_INSIGHTS_ANALYST_VIEWPOINTS_TIMEOUT_SECONDS,DAILY_INSIGHTS_CHAT_ENABLED,DAILY_INSIGHTS_CHAT_MODEL_PROVIDER,DAILY_INSIGHTS_CHAT_MODEL_NAME,DAILY_INSIGHTS_CHAT_MODEL_API_BASE_URL,DAILY_INSIGHTS_CHAT_MODEL_API_KEY,DAILY_INSIGHTS_CHAT_TIMEOUT_SECONDS,DAILY_INSIGHTS_TWELVE_DATA_BASE_URL,DAILY_INSIGHTS_TWELVE_DATA_API_KEY,DAILY_INSIGHTS_R2_ENDPOINT_URL,DAILY_INSIGHTS_R2_BUCKET_NAME,DAILY_INSIGHTS_R2_ACCESS_KEY_ID,DAILY_INSIGHTS_R2_SECRET_ACCESS_KEY,DAILY_INSIGHTS_R2_SIGNED_URL_TTL_SECONDS,DAILY_INSIGHTS_DAILY_NEWS_ENABLED,DAILY_INSIGHTS_YFINANCE_ENABLED,DAILY_INSIGHTS_TWSE_ENABLED,DAILY_INSIGHTS_NEWS_EXTRA_HOSTNAMES,DAILY_INSIGHTS_NEWS_BLOCKED_HOSTNAMES,DAILY_INSIGHTS_GUARDIAN_API_KEY,DAILY_INSIGHTS_SEC_CONTACT_EMAIL,DAILY_INSIGHTS_MODEL_NAME,DAILY_INSIGHTS_MODEL_API_BASE_URL,DAILY_INSIGHTS_NEWS_MODEL_API_KEY
          script: |
            set -euo pipefail
            deploy_source="$HOME/daily-insights-deploy"
            registry_logged_in=0

            cleanup() {
              if [ "$registry_logged_in" -eq 1 ]; then
                docker logout ghcr.io >/dev/null 2>&1 || true
              fi
            }
            trap cleanup EXIT HUP INT TERM

            echo "$GITHUB_TOKEN" |
              docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            registry_logged_in=1

            sudo "$deploy_source/scripts/production/install-host-bundle.sh" \
              "$deploy_source"
            sudo install -o root -g root -m 0644 \
              "$deploy_source/infra/production/cloudflare-realip.conf" \
              /etc/daily-insights/cloudflare-realip.conf

            if ! /opt/daily-insights/scripts/production/deploy.sh; then
              /opt/daily-insights/scripts/production/diagnose.sh || true
              exit 1
            fi
