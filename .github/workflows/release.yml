name: Publish production images

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-image-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish immutable images
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Require the protected default branch
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_API_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=production-api
          cache-to: type=gha,mode=max,scope=production-api

      - name: Build and publish Web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_WEB_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=production-web
          cache-to: type=gha,mode=max,scope=production-web

      - name: Render immutable release manifest
        env:
          API_IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_API_REPOSITORY }}@${{ steps.api.outputs.digest }}
          WEB_IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_WEB_REPOSITORY }}@${{ steps.web.outputs.digest }}
          NGINX_IMAGE: ${{ vars.NGINX_IMAGE }}
          PUBLIC_HOSTNAME: ${{ vars.PUBLIC_HOSTNAME }}
        run: |
          ./scripts/production/render-release-manifest.sh \
            "$API_IMAGE" \
            "$WEB_IMAGE" \
            "$NGINX_IMAGE" \
            "$PUBLIC_HOSTNAME" > release.env

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.sha }}
          path: release.env
          if-no-files-found: error
          retention-days: 30
