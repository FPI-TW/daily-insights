name: CI

on:
  # Main pushes are validated once through release.yml before deployment.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check:web
      - run: pnpm format:check:docs
      - run: pnpm lint:check:web
      - run: pnpm type:check:web

  api-client-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/api --frozen
      - run: pnpm type:check:client
      - run: pnpm api-client:check

  api-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DAILY_INSIGHTS_ENVIRONMENT: test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - run: uv sync --project apps/api --frozen
      - run: uv run --project apps/api ruff format --check apps/api
      - run: uv run --project apps/api ruff check apps/api
      - run: uv run --project apps/api mypy --config-file apps/api/pyproject.toml apps/api/src apps/api/tests

  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:web

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Each shard starts its own mock API and dev server on a separate runner.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The lockfile pins the Playwright version, and with it the browser build.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Downloads Chromium only on a cache miss; system libraries always come from apt.
      - run: pnpm --filter @daily-insights/web exec playwright install --with-deps chromium

      # The suite starts its own mock API and Vite dev server; see playwright.config.ts.
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/2

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 7

  client-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:client

  api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: daily_insights_ci
          POSTGRES_USER: daily_insights_ci
          POSTGRES_PASSWORD: daily-insights-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daily_insights_ci -d daily_insights_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DAILY_INSIGHTS_ENVIRONMENT: test
      DAILY_INSIGHTS_DATABASE_URL: postgresql+psycopg://daily_insights_ci:daily-insights-ci-only@127.0.0.1:5432/daily_insights_ci
      DAILY_INSIGHTS_TEST_DATABASE_URL: postgresql+psycopg://daily_insights_ci:daily-insights-ci-only@127.0.0.1:5432/daily_insights_ci
      DAILY_INSIGHTS_TEST_DATABASE_REQUIRED: "true"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      # The service container cannot take server flags, and durability is
      # pointless for a database that only lives for this job.
      - name: Disable PostgreSQL durability for the ephemeral test database
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U daily_insights_ci -d daily_insights_ci \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"

      - run: uv sync --project apps/api --frozen
      - run: uv run --project apps/api pytest -c apps/api/pyproject.toml -n 4 apps/api/tests

      - name: Validate PostgreSQL migration round trip
        working-directory: apps/api
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web

  api-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - run: uv sync --project apps/api --frozen
      - run: uv build --project apps/api

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate Compose contract
        env:
          POSTGRES_PASSWORD: compose-config-only
        run: docker compose config --quiet

      - name: Validate nginx transport contract
        run: ./scripts/check-nginx-contract.sh

      - name: Validate production deployment contract
        run: ./scripts/check-production-deployment-contract.sh

  validate:
    if: always()
    needs:
      - web-quality
      - api-client-quality
      - api-quality
      - web-tests
      - web-e2e
      - client-tests
      - api-integration
      - web-build
      - api-build
      - contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every validation job to pass
        run: |
          if [[ "${{ needs.web-quality.result }}" != "success" ||
            "${{ needs.api-client-quality.result }}" != "success" ||
            "${{ needs.api-quality.result }}" != "success" ||
            "${{ needs.web-tests.result }}" != "success" ||
            "${{ needs.web-e2e.result }}" != "success" ||
            "${{ needs.client-tests.result }}" != "success" ||
            "${{ needs.api-integration.result }}" != "success" ||
            "${{ needs.web-build.result }}" != "success" ||
            "${{ needs.api-build.result }}" != "success" ||
            "${{ needs.contracts.result }}" != "success" ]]; then
            echo "At least one CI validation job failed or was skipped."
            exit 1
          fi
          echo "All CI validation jobs passed."
