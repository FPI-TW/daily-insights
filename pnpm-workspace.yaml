packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  lightningcss: true
  unrs-resolver: true

overrides:
  # @tailwindcss/typography 0.5.x pins postcss-selector-parser 6.0.10
  # (GHSA-rj75-hqrm-r3gf); 7.x keeps the API it uses and yields identical CSS.
  "@tailwindcss/typography>postcss-selector-parser": ^7.1.6
  # TanStack devtools auto-installs solid-js as a peer, which pnpm update leaves
  # alone; 1.9.17+ depends on seroval 1.6.8+ (GHSA-p6vx-979v-rg4c, GHSA-jp82-f5mq-hwhp).
  solid-js: ^1.9.17
  # GHSA-g3hv-75wg-m249; keep overrides scoped to the affected tooling.
  "eslint>minimatch": ^11.0.1
  "@eslint/config-array>minimatch": ^11.0.1
  # The accompanying Redocly patch adapts its CommonJS/TS imports to the named API.
  "@redocly/openapi-core@1.34.21>minimatch": ^11.0.1

patchedDependencies:
  "@redocly/openapi-core@1.34.21": patches/@redocly__openapi-core@1.34.21.patch
