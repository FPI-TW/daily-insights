# Production Podcast pilot stack. GitHub Actions supplies immutable API/Web
# digests and application settings directly to the SSH deployment process.
name: daily-insights-production

services:
  api:
    image: ${API_IMAGE:?set API_IMAGE to an immutable digest reference}
    container_name: daily-insights-api
    restart: unless-stopped
    environment:
      DAILY_INSIGHTS_ENVIRONMENT: production
      DAILY_INSIGHTS_DATABASE_URL: ${DAILY_INSIGHTS_DATABASE_URL:?set DAILY_INSIGHTS_DATABASE_URL from GitHub Secrets}
      DAILY_INSIGHTS_SESSION_SECRET: ${DAILY_INSIGHTS_SESSION_SECRET:?set DAILY_INSIGHTS_SESSION_SECRET from GitHub Secrets}
      DAILY_INSIGHTS_PASSWORD_PEPPER: ${DAILY_INSIGHTS_PASSWORD_PEPPER:?set DAILY_INSIGHTS_PASSWORD_PEPPER from GitHub Secrets}
      DAILY_INSIGHTS_TRUSTED_PROXY_CIDRS: 172.30.0.0/24
      DAILY_INSIGHTS_MORNING_REPORTS_ENABLED: ${DAILY_INSIGHTS_MORNING_REPORTS_ENABLED:-false}
      DAILY_INSIGHTS_ANALYST_VIEWPOINTS_ENABLED: ${DAILY_INSIGHTS_ANALYST_VIEWPOINTS_ENABLED:-false}
      DAILY_INSIGHTS_ANALYST_VIEWPOINTS_BASE_URL: ${DAILY_INSIGHTS_ANALYST_VIEWPOINTS_BASE_URL:-https://analyst-viewpoints.invalid}
      DAILY_INSIGHTS_ANALYST_VIEWPOINTS_API_KEY: ${DAILY_INSIGHTS_ANALYST_VIEWPOINTS_API_KEY:-}
      DAILY_INSIGHTS_ANALYST_VIEWPOINTS_TIMEOUT_SECONDS: ${DAILY_INSIGHTS_ANALYST_VIEWPOINTS_TIMEOUT_SECONDS:-10}
      DAILY_INSIGHTS_DAILY_NEWS_ENABLED: ${DAILY_INSIGHTS_DAILY_NEWS_ENABLED:-false}
      DAILY_INSIGHTS_YFINANCE_ENABLED: ${DAILY_INSIGHTS_YFINANCE_ENABLED:-false}
      DAILY_INSIGHTS_TWSE_ENABLED: ${DAILY_INSIGHTS_TWSE_ENABLED:-false}
      DAILY_INSIGHTS_NEWS_EXTRA_HOSTNAMES: ${DAILY_INSIGHTS_NEWS_EXTRA_HOSTNAMES:-}
      DAILY_INSIGHTS_NEWS_BLOCKED_HOSTNAMES: ${DAILY_INSIGHTS_NEWS_BLOCKED_HOSTNAMES:-}
      DAILY_INSIGHTS_GUARDIAN_API_KEY: ${DAILY_INSIGHTS_GUARDIAN_API_KEY:-}
      DAILY_INSIGHTS_SEC_CONTACT_EMAIL: ${DAILY_INSIGHTS_SEC_CONTACT_EMAIL:-}
      DAILY_INSIGHTS_MODEL_PROVIDER: ${DAILY_INSIGHTS_MODEL_PROVIDER:-deepseek}
      DAILY_INSIGHTS_MODEL_NAME: ${DAILY_INSIGHTS_MODEL_NAME:-deepseek-chat}
      DAILY_INSIGHTS_MODEL_API_BASE_URL: ${DAILY_INSIGHTS_MODEL_API_BASE_URL:-https://api.deepseek.com}
      DAILY_INSIGHTS_NEWS_MODEL_API_KEY: ${DAILY_INSIGHTS_NEWS_MODEL_API_KEY:-}
      DAILY_INSIGHTS_MODEL_TIMEOUT_SECONDS: ${DAILY_INSIGHTS_MODEL_TIMEOUT_SECONDS:-120}
      DAILY_INSIGHTS_NEWS_FETCH_TIMEOUT_SECONDS: ${DAILY_INSIGHTS_NEWS_FETCH_TIMEOUT_SECONDS:-25}
      DAILY_INSIGHTS_NEWS_DISCOVERY_TIMEOUT_SECONDS: ${DAILY_INSIGHTS_NEWS_DISCOVERY_TIMEOUT_SECONDS:-30}
      DAILY_INSIGHTS_CHAT_ENABLED: ${DAILY_INSIGHTS_CHAT_ENABLED:-false}
      DAILY_INSIGHTS_CHAT_MODEL_PROVIDER: ${DAILY_INSIGHTS_CHAT_MODEL_PROVIDER:-deepseek}
      DAILY_INSIGHTS_CHAT_MODEL_NAME: ${DAILY_INSIGHTS_CHAT_MODEL_NAME:-deepseek-chat}
      DAILY_INSIGHTS_CHAT_MODEL_API_BASE_URL: ${DAILY_INSIGHTS_CHAT_MODEL_API_BASE_URL:-https://api.deepseek.com}
      DAILY_INSIGHTS_CHAT_MODEL_API_KEY: ${DAILY_INSIGHTS_CHAT_MODEL_API_KEY:-}
      DAILY_INSIGHTS_CHAT_TIMEOUT_SECONDS: ${DAILY_INSIGHTS_CHAT_TIMEOUT_SECONDS:-90}
      DAILY_INSIGHTS_TWELVE_DATA_BASE_URL: ${DAILY_INSIGHTS_TWELVE_DATA_BASE_URL:-https://api.twelvedata.com}
      DAILY_INSIGHTS_TWELVE_DATA_API_KEY: ${DAILY_INSIGHTS_TWELVE_DATA_API_KEY:-}
      DAILY_INSIGHTS_R2_ENDPOINT_URL: ${DAILY_INSIGHTS_R2_ENDPOINT_URL:?set DAILY_INSIGHTS_R2_ENDPOINT_URL}
      DAILY_INSIGHTS_R2_BUCKET_NAME: ${DAILY_INSIGHTS_R2_BUCKET_NAME:?set DAILY_INSIGHTS_R2_BUCKET_NAME}
      DAILY_INSIGHTS_R2_ACCESS_KEY_ID: ${DAILY_INSIGHTS_R2_ACCESS_KEY_ID:?set DAILY_INSIGHTS_R2_ACCESS_KEY_ID from GitHub Secrets}
      DAILY_INSIGHTS_R2_SECRET_ACCESS_KEY: ${DAILY_INSIGHTS_R2_SECRET_ACCESS_KEY:?set DAILY_INSIGHTS_R2_SECRET_ACCESS_KEY from GitHub Secrets}
      DAILY_INSIGHTS_R2_SIGNED_URL_TTL_SECONDS: ${DAILY_INSIGHTS_R2_SIGNED_URL_TTL_SECONDS:?set DAILY_INSIGHTS_R2_SIGNED_URL_TTL_SECONDS}
    command:
      [
        "uvicorn",
        "daily_insights_api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "172.30.0.0/24",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"
    networks:
      - app

  orchestration-worker:
    image: ${API_IMAGE:?set API_IMAGE to an immutable digest reference}
    container_name: daily-insights-orchestration-worker
    restart: unless-stopped
    environment:
      DAILY_INSIGHTS_ENVIRONMENT: production
      DAILY_INSIGHTS_RUNTIME_ROLE: orchestration-worker
      DAILY_INSIGHTS_DATABASE_URL: ${DAILY_INSIGHTS_DATABASE_URL:?set DAILY_INSIGHTS_DATABASE_URL from GitHub Secrets}
      DAILY_INSIGHTS_ORCHESTRATION_ENABLED: ${DAILY_INSIGHTS_ORCHESTRATION_ENABLED:-false}
      DAILY_INSIGHTS_ORCHESTRATION_ACTIVATION_DATE: ${DAILY_INSIGHTS_ORCHESTRATION_ACTIVATION_DATE:-}
      DAILY_INSIGHTS_MORNING_REPORTS_ENABLED: ${DAILY_INSIGHTS_MORNING_REPORTS_ENABLED:-false}
      DAILY_INSIGHTS_YFINANCE_ENABLED: ${DAILY_INSIGHTS_YFINANCE_ENABLED:-false}
      DAILY_INSIGHTS_TWSE_ENABLED: ${DAILY_INSIGHTS_TWSE_ENABLED:-false}
      DAILY_INSIGHTS_TWELVE_DATA_BASE_URL: ${DAILY_INSIGHTS_TWELVE_DATA_BASE_URL:-https://api.twelvedata.com}
      DAILY_INSIGHTS_TWELVE_DATA_API_KEY: ${DAILY_INSIGHTS_TWELVE_DATA_API_KEY:-}
      DAILY_INSIGHTS_DAILY_NEWS_ENABLED: ${DAILY_INSIGHTS_DAILY_NEWS_ENABLED:-false}
      DAILY_INSIGHTS_ANALYST_VIEWPOINTS_ENABLED: ${DAILY_INSIGHTS_ANALYST_VIEWPOINTS_ENABLED:-false}
      DAILY_INSIGHTS_ANALYST_VIEWPOINTS_BASE_URL: ${DAILY_INSIGHTS_ANALYST_VIEWPOINTS_BASE_URL:-https://analyst-viewpoints.invalid}
      DAILY_INSIGHTS_ANALYST_VIEWPOINTS_API_KEY: ${DAILY_INSIGHTS_ANALYST_VIEWPOINTS_API_KEY:-}
      DAILY_INSIGHTS_ANALYST_VIEWPOINTS_TIMEOUT_SECONDS: ${DAILY_INSIGHTS_ANALYST_VIEWPOINTS_TIMEOUT_SECONDS:-10}
      DAILY_INSIGHTS_NEWS_EXTRA_HOSTNAMES: ${DAILY_INSIGHTS_NEWS_EXTRA_HOSTNAMES:-}
      DAILY_INSIGHTS_NEWS_BLOCKED_HOSTNAMES: ${DAILY_INSIGHTS_NEWS_BLOCKED_HOSTNAMES:-}
      DAILY_INSIGHTS_GUARDIAN_API_KEY: ${DAILY_INSIGHTS_GUARDIAN_API_KEY:-}
      DAILY_INSIGHTS_SEC_CONTACT_EMAIL: ${DAILY_INSIGHTS_SEC_CONTACT_EMAIL:-}
      DAILY_INSIGHTS_MODEL_PROVIDER: ${DAILY_INSIGHTS_MODEL_PROVIDER:-deepseek}
      DAILY_INSIGHTS_MODEL_NAME: ${DAILY_INSIGHTS_MODEL_NAME:-deepseek-chat}
      DAILY_INSIGHTS_MODEL_API_BASE_URL: ${DAILY_INSIGHTS_MODEL_API_BASE_URL:-https://api.deepseek.com}
      DAILY_INSIGHTS_NEWS_MODEL_API_KEY: ${DAILY_INSIGHTS_NEWS_MODEL_API_KEY:-}
      DAILY_INSIGHTS_MODEL_TIMEOUT_SECONDS: ${DAILY_INSIGHTS_MODEL_TIMEOUT_SECONDS:-120}
      DAILY_INSIGHTS_NEWS_FETCH_TIMEOUT_SECONDS: ${DAILY_INSIGHTS_NEWS_FETCH_TIMEOUT_SECONDS:-25}
      DAILY_INSIGHTS_NEWS_DISCOVERY_TIMEOUT_SECONDS: ${DAILY_INSIGHTS_NEWS_DISCOVERY_TIMEOUT_SECONDS:-30}
    command: ["python", "-m", "daily_insights_api.scripts.run_orchestration_worker"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import time; from pathlib import Path; p = Path('/tmp/orchestration-worker-heartbeat'); assert p.exists() and time.time() - p.stat().st_mtime < 90",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - app

  podcast-media-worker:
    image: ${API_IMAGE:?set API_IMAGE to an immutable digest reference}
    container_name: daily-insights-podcast-media-worker
    restart: unless-stopped
    environment:
      DAILY_INSIGHTS_ENVIRONMENT: production
      DAILY_INSIGHTS_RUNTIME_ROLE: media-worker
      DAILY_INSIGHTS_DATABASE_URL: ${DAILY_INSIGHTS_DATABASE_URL:?set DAILY_INSIGHTS_DATABASE_URL from GitHub Secrets}
      DAILY_INSIGHTS_R2_ENDPOINT_URL: ${DAILY_INSIGHTS_R2_ENDPOINT_URL:?set DAILY_INSIGHTS_R2_ENDPOINT_URL}
      DAILY_INSIGHTS_R2_BUCKET_NAME: ${DAILY_INSIGHTS_R2_BUCKET_NAME:?set DAILY_INSIGHTS_R2_BUCKET_NAME}
      DAILY_INSIGHTS_R2_ACCESS_KEY_ID: ${DAILY_INSIGHTS_R2_MEDIA_WORKER_ACCESS_KEY_ID:?set worker-scoped R2 access key from GitHub Secrets}
      DAILY_INSIGHTS_R2_SECRET_ACCESS_KEY: ${DAILY_INSIGHTS_R2_MEDIA_WORKER_SECRET_ACCESS_KEY:?set worker-scoped R2 secret from GitHub Secrets}
      DAILY_INSIGHTS_PODCAST_MEDIA_POLL_SECONDS: ${DAILY_INSIGHTS_PODCAST_MEDIA_POLL_SECONDS:-2}
      DAILY_INSIGHTS_PODCAST_UPLOAD_CLEANUP_GRACE_SECONDS: ${DAILY_INSIGHTS_PODCAST_UPLOAD_CLEANUP_GRACE_SECONDS:-86400}
      DAILY_INSIGHTS_PODCAST_MEDIA_SPOOL_DIR: /var/spool/podcast-media
    command: ["python", "-m", "daily_insights_api.scripts.run_podcast_media_worker"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import time; from pathlib import Path; p = Path('/tmp/podcast-media-worker-heartbeat'); assert p.exists() and time.time() - p.stat().st_mtime < 90",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - podcast-media-spool:/var/spool/podcast-media
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - app

  orchestration-dispatcher:
    image: ${API_IMAGE:?set API_IMAGE to an immutable digest reference}
    container_name: daily-insights-orchestration-dispatcher
    restart: unless-stopped
    environment:
      DAILY_INSIGHTS_ENVIRONMENT: production
      DAILY_INSIGHTS_DATABASE_URL: ${DAILY_INSIGHTS_DATABASE_URL:?set DAILY_INSIGHTS_DATABASE_URL from GitHub Secrets}
      DAILY_INSIGHTS_ORCHESTRATION_ENABLED: ${DAILY_INSIGHTS_ORCHESTRATION_ENABLED:-false}
      DAILY_INSIGHTS_ORCHESTRATION_ACTIVATION_DATE: ${DAILY_INSIGHTS_ORCHESTRATION_ACTIVATION_DATE:-}
    command:
      [
        "python",
        "-m",
        "daily_insights_api.scripts.run_orchestration_dispatcher",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import time; from pathlib import Path; p = Path('/tmp/orchestration-dispatcher-heartbeat'); assert p.exists() and time.time() - p.stat().st_mtime < 90",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - app

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE to an immutable digest reference}
    container_name: daily-insights-web
    restart: unless-stopped
    environment:
      APP_ENV: production
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"
    networks:
      - app

  nginx:
    image: docker.io/library/nginx@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    container_name: daily-insights-nginx
    restart: unless-stopped
    environment:
      NGINX_ENVSUBST_FILTER: ^PUBLIC_HOSTNAME$
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME}
    ports:
      - "443:443"
    volumes:
      - ./infra/production/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/production/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/daily-insights/cloudflare-realip.conf:/etc/nginx/cloudflare-realip.conf:ro
      - /etc/daily-insights/tls/origin.crt:/etc/nginx/tls/origin.crt:ro
      - /etc/daily-insights/tls/origin.key:/etc/nginx/tls/origin.key:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -T 2 -O /dev/null http://127.0.0.1:8080/nginx-health/api && wget -q -T 2 -O /dev/null http://127.0.0.1:8080/nginx-health/web",
        ]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
      - /tmp:size=16m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks:
      - app

networks:
  app:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  podcast-media-spool:
