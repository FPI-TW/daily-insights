# Production Podcast pilot stack. GitHub Actions supplies immutable API/Web
# digests and application settings directly to the SSH deployment process.
name: daily-insights-production

services:
  api:
    image: ${API_IMAGE:?set API_IMAGE to an immutable digest reference}
    container_name: daily-insights-api
    restart: unless-stopped
    environment:
      DAILY_INSIGHTS_ENVIRONMENT: production
      DAILY_INSIGHTS_DATABASE_URL: ${DAILY_INSIGHTS_DATABASE_URL:?set DAILY_INSIGHTS_DATABASE_URL from GitHub Secrets}
      DAILY_INSIGHTS_SESSION_SECRET: ${DAILY_INSIGHTS_SESSION_SECRET:?set DAILY_INSIGHTS_SESSION_SECRET from GitHub Secrets}
      DAILY_INSIGHTS_PASSWORD_PEPPER: ${DAILY_INSIGHTS_PASSWORD_PEPPER:?set DAILY_INSIGHTS_PASSWORD_PEPPER from GitHub Secrets}
      DAILY_INSIGHTS_TRUSTED_PROXY_CIDRS: 172.30.0.0/24
      DAILY_INSIGHTS_MORNING_REPORTS_ENABLED: ${DAILY_INSIGHTS_MORNING_REPORTS_ENABLED:-false}
      DAILY_INSIGHTS_ANALYST_VIEWPOINTS_ENABLED: ${DAILY_INSIGHTS_ANALYST_VIEWPOINTS_ENABLED:-false}
      DAILY_INSIGHTS_ANALYST_VIEWPOINTS_BASE_URL: ${DAILY_INSIGHTS_ANALYST_VIEWPOINTS_BASE_URL:-https://analyst-viewpoints.invalid}
      DAILY_INSIGHTS_ANALYST_VIEWPOINTS_API_KEY: ${DAILY_INSIGHTS_ANALYST_VIEWPOINTS_API_KEY:-}
      DAILY_INSIGHTS_ANALYST_VIEWPOINTS_TIMEOUT_SECONDS: ${DAILY_INSIGHTS_ANALYST_VIEWPOINTS_TIMEOUT_SECONDS:-10}
      DAILY_INSIGHTS_DAILY_NEWS_ENABLED: ${DAILY_INSIGHTS_DAILY_NEWS_ENABLED:-false}
      DAILY_INSIGHTS_YFINANCE_ENABLED: ${DAILY_INSIGHTS_YFINANCE_ENABLED:-false}
      DAILY_INSIGHTS_TWSE_ENABLED: ${DAILY_INSIGHTS_TWSE_ENABLED:-false}
      DAILY_INSIGHTS_NEWS_EXTRA_HOSTNAMES: ${DAILY_INSIGHTS_NEWS_EXTRA_HOSTNAMES:-}
      DAILY_INSIGHTS_NEWS_BLOCKED_HOSTNAMES: ${DAILY_INSIGHTS_NEWS_BLOCKED_HOSTNAMES:-}
      DAILY_INSIGHTS_GUARDIAN_API_KEY: ${DAILY_INSIGHTS_GUARDIAN_API_KEY:-}
      DAILY_INSIGHTS_SEC_CONTACT_EMAIL: ${DAILY_INSIGHTS_SEC_CONTACT_EMAIL:-}
      DAILY_INSIGHTS_MODEL_PROVIDER: ${DAILY_INSIGHTS_MODEL_PROVIDER:-deepseek}
      DAILY_INSIGHTS_MODEL_NAME: ${DAILY_INSIGHTS_MODEL_NAME:-deepseek-chat}
      DAILY_INSIGHTS_MODEL_API_BASE_URL: ${DAILY_INSIGHTS_MODEL_API_BASE_URL:-https://api.deepseek.com}
      DAILY_INSIGHTS_MODEL_API_KEY: ${DAILY_INSIGHTS_MODEL_API_KEY:-}
      DAILY_INSIGHTS_MODEL_TIMEOUT_SECONDS: ${DAILY_INSIGHTS_MODEL_TIMEOUT_SECONDS:-120}
      DAILY_INSIGHTS_NEWS_FETCH_TIMEOUT_SECONDS: ${DAILY_INSIGHTS_NEWS_FETCH_TIMEOUT_SECONDS:-25}
      DAILY_INSIGHTS_NEWS_DISCOVERY_TIMEOUT_SECONDS: ${DAILY_INSIGHTS_NEWS_DISCOVERY_TIMEOUT_SECONDS:-30}
      DAILY_INSIGHTS_CHAT_ENABLED: ${DAILY_INSIGHTS_CHAT_ENABLED:-false}
      DAILY_INSIGHTS_CHAT_MODEL_PROVIDER: ${DAILY_INSIGHTS_CHAT_MODEL_PROVIDER:-deepseek}
      DAILY_INSIGHTS_CHAT_MODEL_NAME: ${DAILY_INSIGHTS_CHAT_MODEL_NAME:-deepseek-chat}
      DAILY_INSIGHTS_CHAT_MODEL_API_BASE_URL: ${DAILY_INSIGHTS_CHAT_MODEL_API_BASE_URL:-https://api.deepseek.com}
      DAILY_INSIGHTS_CHAT_MODEL_API_KEY: ${DAILY_INSIGHTS_CHAT_MODEL_API_KEY:-}
      DAILY_INSIGHTS_CHAT_TIMEOUT_SECONDS: ${DAILY_INSIGHTS_CHAT_TIMEOUT_SECONDS:-90}
      DAILY_INSIGHTS_PODCAST_ANALYSIS_ENABLED: ${DAILY_INSIGHTS_PODCAST_ANALYSIS_ENABLED:-false}
      DAILY_INSIGHTS_OPENAI_API_KEY: ${DAILY_INSIGHTS_OPENAI_API_KEY:-}
      DAILY_INSIGHTS_TRANSCRIPTION_MODEL: ${DAILY_INSIGHTS_TRANSCRIPTION_MODEL:-whisper-1}
      DAILY_INSIGHTS_TWELVE_DATA_BASE_URL: ${DAILY_INSIGHTS_TWELVE_DATA_BASE_URL:-https://api.twelvedata.com}
      DAILY_INSIGHTS_TWELVE_DATA_API_KEY: ${DAILY_INSIGHTS_TWELVE_DATA_API_KEY:-}
      DAILY_INSIGHTS_R2_ENDPOINT_URL: ${DAILY_INSIGHTS_R2_ENDPOINT_URL:?set DAILY_INSIGHTS_R2_ENDPOINT_URL}
      DAILY_INSIGHTS_R2_BUCKET_NAME: ${DAILY_INSIGHTS_R2_BUCKET_NAME:?set DAILY_INSIGHTS_R2_BUCKET_NAME}
      DAILY_INSIGHTS_R2_ACCESS_KEY_ID: ${DAILY_INSIGHTS_R2_ACCESS_KEY_ID:?set DAILY_INSIGHTS_R2_ACCESS_KEY_ID from GitHub Secrets}
      DAILY_INSIGHTS_R2_SECRET_ACCESS_KEY: ${DAILY_INSIGHTS_R2_SECRET_ACCESS_KEY:?set DAILY_INSIGHTS_R2_SECRET_ACCESS_KEY from GitHub Secrets}
      DAILY_INSIGHTS_R2_SIGNED_URL_TTL_SECONDS: ${DAILY_INSIGHTS_R2_SIGNED_URL_TTL_SECONDS:?set DAILY_INSIGHTS_R2_SIGNED_URL_TTL_SECONDS}
    command:
      [
        "uvicorn",
        "daily_insights_api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "172.30.0.0/24",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"
    networks:
      - app

