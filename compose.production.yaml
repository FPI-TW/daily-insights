    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - app

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE to an immutable digest reference}
    container_name: daily-insights-web
    restart: unless-stopped
    environment:
      APP_ENV: production
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"
    networks:
      - app

  nginx:
    image: docker.io/library/nginx@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    container_name: daily-insights-nginx
    restart: unless-stopped
    environment:
      NGINX_ENVSUBST_FILTER: ^PUBLIC_HOSTNAME$
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME}
    ports:
      - "443:443"
    volumes:
      - ./infra/production/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/production/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/daily-insights/cloudflare-realip.conf:/etc/nginx/cloudflare-realip.conf:ro
      - /etc/daily-insights/tls/origin.crt:/etc/nginx/tls/origin.crt:ro
      - /etc/daily-insights/tls/origin.key:/etc/nginx/tls/origin.key:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -T 2 -O /dev/null http://127.0.0.1:8080/nginx-health/api && wget -q -T 2 -O /dev/null http://127.0.0.1:8080/nginx-health/web",
        ]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
      - /tmp:size=16m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks:
      - app

networks:
  app:
    ipam:
      config:
        - subnet: 172.30.0.0/24
