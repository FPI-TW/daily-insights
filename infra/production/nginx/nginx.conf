user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker's embedded DNS tracks Compose service aliases when containers are
    # replaced. Upstream zones opt in to runtime re-resolution.
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 1s;

    # This file is materialized from Cloudflare's published IPv4/IPv6 ranges
    # during host provisioning. Only those sources may supply CF-Connecting-IP.
    include /etc/nginx/cloudflare-realip.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" request_id=$request_id '
                    'request_time=$request_time upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    limit_req_zone $binary_remote_addr zone=media_signing:10m rate=10r/s;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_header_timeout 10s;
    client_body_timeout 60s;
    reset_timedout_connection on;

    include /etc/nginx/conf.d/*.conf;
}
