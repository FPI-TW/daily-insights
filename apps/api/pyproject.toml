[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daily-insights-api"
version = "0.1.0"
description = "Daily Insights modular-monolith API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.40,<2",
  "defusedxml>=0.7,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langdetect>=1.0.9",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "types-boto3[s3]>=1.40,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/daily_insights_api"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires a PostgreSQL test database",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["alembic.*", "defusedxml.*", "langdetect.*"]
ignore_missing_imports = true
